name: "Update Cloudformation Template"

on:
  pull_request:
    paths:
      - 'FSx-Audit-Logs/Ingest-NAS-Audit-Logs-CloudWatch/ingest_audit_log.py'
  push:
    paths:
      - 'FSx-Audit-Logs/Ingest-NAS-Audit-Logs-CloudWatch/ingest_audit_log.py'
    branches:
      - main

jobs:
  update-Cloudformation-Template:
    runs-on: ubuntu-latest
    permissions:
      # Give the default GITHUB_TOKEN write permission to commit and push the
      # added or changed files to the repository.
      contents: write

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout pull request
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Update the Cloudformation Template
        shell: bash
        working-directory: FSx-Audit-Logs/Ingest-NAS-Audit-Logs-CloudWatch
        run: ./updateIngessAuditLogsCFTemplate

      - name: Commit the changes
        uses: step-security/git-auto-commit-action@905c3cd6e9ed2b67b4d46ff401fdb6d745d0ff9d # v7.1.0
